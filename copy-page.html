<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>富文本复制助手</title>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-top: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .title {
      font-size: 24px;
      color: #3B82F6;
      text-align: center;
      margin-bottom: 24px;
    }

    .step-label {
      font-size: 18px;
      font-weight: 600;
      color: #3B82F6;
      margin-bottom: 8px;
    }

    .step-desc {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .html-textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      resize: vertical;
      transition: border-color 0.2s;
    }

    .html-textarea:focus {
      outline: none;
      border-color: #3B82F6;
    }

    .preview-label {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .preview-box {
      min-height: 200px;
      padding: 16px;
      border: 2px dashed #E5E7EB;
      border-radius: 12px;
      background: #FFFFFF;
      margin-bottom: 24px;
      overflow: auto;
    }

    .preview-box .placeholder {
      color: #9CA3AF;
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    .button {
      width: 100%;
      padding: 16px;
      background: #3B82F6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .button:hover {
      background: #2563EB;
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      background: #CCCCCC;
      cursor: not-allowed;
      transform: none;
    }

    .success {
      text-align: center;
      padding: 60px 20px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .success-title {
      font-size: 28px;
      color: #10B981;
      margin-bottom: 12px;
    }

    .success-desc {
      font-size: 16px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .return-hint {
      font-size: 14px;
      color: #D97757;
      text-align: center;
      padding: 12px;
      background: rgba(217, 119, 87, 0.1);
      border-radius: 8px;
      margin-top: 24px;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- 步骤 1：粘贴和预览 -->
    <div class="step" id="step1">
      <h1 class="title">📋 富文本复制助手</h1>

      <div class="step-label">步骤 1：粘贴 HTML 源码</div>
      <div class="step-desc">
        请将小程序中复制的 HTML 源码粘贴到下方文本框
      </div>

      <textarea
        id="htmlInput"
        class="html-textarea"
        placeholder="在此粘贴 HTML 源码..."
        oninput="handleInput()"
      ></textarea>

      <div class="preview-label">预览效果：</div>
      <div id="preview" class="preview-box">
        <p class="placeholder">预览区域 - 粘贴 HTML 后将在此显示效果</p>
      </div>

      <button
        class="button"
        id="copyBtn"
        onclick="copyRichText()"
        disabled
      >
        复制富文本到剪贴板
      </button>
    </div>

    <!-- 步骤 2：复制成功 -->
    <div class="step success" id="step2" style="display: none;">
      <div class="icon">✅</div>
      <h2 class="success-title">复制成功！</h2>
      <p class="success-desc">现在可以在公众号编辑器中粘贴（Ctrl+V）</p>
      <p class="return-hint">👆 点击左上角返回按钮回到小程序</p>
    </div>
  </div>

  <script>
    // 检测微信 JSSDK 是否加载成功
    window.addEventListener('load', function() {
      if (window.wx) {
        console.log('[CopyPage] 微信 JSSDK 加载成功')
      } else {
        console.warn('[CopyPage] 微信 JSSDK 未加载，返回功能可能受限')
      }
    })

    // 处理输入，实时预览
    function handleInput() {
      const htmlInput = document.getElementById('htmlInput').value.trim();
      const preview = document.getElementById('preview');
      const copyBtn = document.getElementById('copyBtn');

      if (htmlInput) {
        // 显示预览
        preview.innerHTML = htmlInput;
        copyBtn.disabled = false;
      } else {
        // 显示占位符
        preview.innerHTML = '<p class="placeholder">预览区域 - 粘贴 HTML 后将在此显示效果</p>';
        copyBtn.disabled = true;
      }
    }

    // 复制富文本到剪贴板
    async function copyRichText() {
      try {
        const htmlContent = document.getElementById('htmlInput').value.trim();

        if (!htmlContent) {
          alert('请先粘贴 HTML 源码');
          return;
        }

        // 提取纯文本作为备用
        const plainText = extractPlainText(htmlContent);

        // 创建 ClipboardItem，同时提供 text/html 和 text/plain
        const clipboardItem = new ClipboardItem({
          'text/html': new Blob([htmlContent], { type: 'text/html' }),
          'text/plain': new Blob([plainText], { type: 'text/plain' })
        });

        await navigator.clipboard.write([clipboardItem]);

        // 显示成功界面
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';

        // 用户点击系统返回按钮即可

      } catch (err) {
        console.error('复制失败:', err);
        alert('复制失败: ' + err.message + '\n\n请检查浏览器权限或手动复制预览区域的内容');
      }
    }

    // 从 HTML 中提取纯文本
    function extractPlainText(html) {
      try {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        let text = tmp.textContent || tmp.innerText || '';

        // 清理多余的空白字符
        const whitespaceRegex = new RegExp('\\s+', 'g');
        const newlineRegex = new RegExp('\\n\\s*\\n', 'g');
        text = text.replace(whitespaceRegex, ' ').replace(newlineRegex, '\n').trim();

        return text || '内容为空';
      } catch (e) {
        console.error('提取纯文本失败:', e);
        return html;
      }
    }

    // 从 HTML 中提取纯文本
  </script>
</body>
</html>
